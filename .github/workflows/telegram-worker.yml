name: Telegram Worker CI

on:
  pull_request:
    paths:
      - "server/telegram-worker/**"
      - "supabase/migrations/**"
      - ".github/workflows/telegram-worker.yml"
  push:
    branches:
      - feature/hostless-telegram-worker
    paths:
      - "server/telegram-worker/**"
      - "supabase/migrations/**"
      - ".github/workflows/telegram-worker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/telegram-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
