name: Termux bridge source checks

on:
  pull_request:
    paths:
      - "tools/termux-bridge/**"
      - "supabase/functions/termux-bridge/**"
      - "supabase/functions/contacts-bridge/**"
      - "supabase/migrations/*termux*"
      - "supabase/migrations/*contact_bridge_sync*"
      - ".github/workflows/termux-bridge-check.yml"
  push:
    branches: [main, feature/brave-accessibility-control]
    paths:
      - "tools/termux-bridge/**"
      - "supabase/functions/termux-bridge/**"
      - "supabase/functions/contacts-bridge/**"
      - "supabase/migrations/*termux*"
      - "supabase/migrations/*contact_bridge_sync*"

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Termux JavaScript syntax
        run: |
          node --check tools/termux-bridge/setup.mjs
          node --check tools/termux-bridge/bridge.mjs
          node --check tools/termux-bridge/terminal-sessions.mjs
          node --check tools/termux-bridge/shizuku-files.mjs
          node --check tools/termux-bridge/apk-inspect.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/termux-bridge/index.ts
          deno check supabase/functions/contacts-bridge/index.ts
