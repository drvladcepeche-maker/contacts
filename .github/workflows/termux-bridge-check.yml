name: Termux bridge source checks

on:
  pull_request:
    paths:
      - "tools/termux-bridge/**"
      - "supabase/functions/termux-bridge/**"
      - "supabase/migrations/*termux*"
      - ".github/workflows/termux-bridge-check.yml"
  push:
    branches: [main]
    paths:
      - "tools/termux-bridge/**"
      - "supabase/functions/termux-bridge/**"
      - "supabase/migrations/*termux*"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Termux JavaScript syntax
        run: |
          node --check tools/termux-bridge/setup.mjs
          node --check tools/termux-bridge/bridge.mjs
          node --check tools/termux-bridge/apk-inspect.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/termux-bridge/index.ts
          deno check supabase/functions/contacts-bridge/index.ts
      - name: Test contacts bridge diagnostic redaction
        run: deno test supabase/functions/contacts-bridge/tests/
      - name: Smoke-test contacts bridge authentication and CORS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/contacts-bridge"
          PREFLIGHT_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$URL" \
            -H 'Origin: https://smoke-test.invalid' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type')"
          if [[ "$PREFLIGHT_STATUS" != "200" && "$PREFLIGHT_STATUS" != "204" ]]; then
            echo "::error::contacts-bridge CORS preflight returned HTTP $PREFLIGHT_STATUS"
            exit 1
          fi
          UNAUTH_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            --data '{"action":"poll_commands"}')"
          if [[ "$UNAUTH_STATUS" != "401" ]]; then
            echo "::error::contacts-bridge missing-token request returned HTTP $UNAUTH_STATUS, expected 401"
            exit 1
          fi
          INVALID_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-smoke-test-token' \
            --data '{"action":"poll_commands"}')"
          if [[ "$INVALID_STATUS" != "401" ]]; then
            echo "::error::contacts-bridge invalid-token request returned HTTP $INVALID_STATUS, expected 401"
            exit 1
          fi
          echo "CORS preflight and unauthenticated/invalid-token rejection verified."
