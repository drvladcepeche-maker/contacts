name: Build APK
on:
  push:
    branches: [main, feature/brave-accessibility-control, 'fix/**']
  pull_request:
    branches: [main, feature/brave-accessibility-control]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Configure stable signing when secrets are available
        id: signing
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Stable signing secrets are not configured; this build will use the temporary runner debug key and will not be published as an update."
            echo "stable_signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/mycontacts-signing.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "MYCONTACTS_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "MYCONTACTS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MYCONTACTS_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MYCONTACTS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Stable Android signing is configured."
          echo "stable_signing=true" >> "$GITHUB_OUTPUT"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: moi-kontakty-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare signed update assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/brave-accessibility-control') && steps.signing.outputs.stable_signing == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$RUNNER_TEMP/moi-kontakty.apk"
          cd "$RUNNER_TEMP"
          sha256sum moi-kontakty.apk > moi-kontakty.apk.sha256
      - name: Create draft signed update release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/brave-accessibility-control') && steps.signing.outputs.stable_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mycontacts-app-${{ github.sha }}
          target_commitish: ${{ github.ref_name }}
          name: Мои контакты — 0.6.${{ github.run_number }}
          body: |
            Автоматическая подписанная сборка приложения.
            Версия: 0.6.${{ github.run_number }}
            Version code: 1000 + ${{ github.run_number }}
            Commit: ${{ github.sha }}
          prerelease: true
          draft: true
          make_latest: false
          files: |
            ${{ runner.temp }}/moi-kontakty.apk
            ${{ runner.temp }}/moi-kontakty.apk.sha256

      - name: Publish immutable signed update release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/brave-accessibility-control') && steps.signing.outputs.stable_signing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mycontacts-app-${{ github.sha }}
        shell: bash
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
          test -n "$release_id"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false
