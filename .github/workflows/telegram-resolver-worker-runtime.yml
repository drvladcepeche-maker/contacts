name: Telegram Resolver Worker
on:
  push:
    paths:
      - '.github/workflows/telegram-resolver-worker-runtime.yml'
      - 'server/telegram-worker/src/**'
      - 'server/telegram-worker/test/**'
      - 'server/telegram-worker/package.json'
      - 'server/telegram-worker/tsconfig.json'
      - 'supabase/functions/contacts-bridge/index.ts'
  pull_request:
    paths:
      - '.github/workflows/telegram-resolver-worker-runtime.yml'
      - 'server/telegram-worker/src/**'
      - 'server/telegram-worker/test/**'
      - 'server/telegram-worker/package.json'
      - 'server/telegram-worker/tsconfig.json'
      - 'supabase/functions/contacts-bridge/index.ts'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-resolver-worker
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-worker:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: server/telegram-worker
        run: npm install
      - name: Run worker tests
        working-directory: server/telegram-worker
        run: npm test
      - name: Build worker
        working-directory: server/telegram-worker
        run: npm run build

  check-ready:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TELEGRAM_RESOLVER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.queue.outputs.ready }}
    steps:
      - name: Check whether a Telegram batch is due
        id: queue
        env:
          SUPABASE_URL: https://xevqbgjtxuveeqaiacvm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          stale="$(date -u -d '30 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          common_args=(
            --get
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
            --data-urlencode "select=id"
            --data-urlencode "limit=1"
          )
          if ! queued="$(curl -fsS "${common_args[@]}" --data-urlencode "status=eq.queued" --data-urlencode "or=(paused_until.is.null,paused_until.lte.${now})" "${SUPABASE_URL}/rest/v1/telegram_match_jobs")"; then
            echo "Queue precheck failed; falling back to the worker's own claim check."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$queued" != "[]" ]; then
            echo "A due queued Telegram batch exists."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! stale_running="$(curl -fsS "${common_args[@]}" --data-urlencode "status=eq.running" --data-urlencode "claimed_at=lt.${stale}" --data-urlencode "or=(paused_until.is.null,paused_until.lte.${now})" "${SUPABASE_URL}/rest/v1/telegram_match_jobs")"; then
            echo "Stale-job precheck failed; falling back to the worker's own claim check."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$stale_running" = "[]" ]; then
            echo "No due queued batch or stale running job."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "A stale running Telegram batch needs recovery."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  process-queue:
    permissions:
      contents: read
      issues: write
    needs: check-ready
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TELEGRAM_RESOLVER_ENABLED == 'true' && needs.check-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: server/telegram-worker
        run: npm install 2>&1 | tee -a "$RUNNER_TEMP/worker.log"
      - name: Build worker
        working-directory: server/telegram-worker
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/worker.log"
      - name: Process one checkpointed queue batch
        working-directory: server/telegram-worker
        env:
          SUPABASE_URL: https://xevqbgjtxuveeqaiacvm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          RUN_ONCE: "true"
          MAX_CANDIDATES_PER_RUN: "5"
          BATCH_COOLDOWN_MS: "3600000"
          MIN_REQUEST_INTERVAL_MS: "60000"
          REQUEST_JITTER_MS: "15000"
        run: node dist/index.js 2>&1 | tee -a "$RUNNER_TEMP/worker.log"
      - name: Publish redacted failure notice to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The Telegram resolver worker failed."
            echo
            echo "Run: $RUN_URL"
            echo "Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Raw worker output is intentionally not copied into this issue. Inspect the Actions run using an authorized account; do not paste credentials, phone numbers, Telegram IDs, device IDs, or contact data into public issues."
          } > "$RUNNER_TEMP/report.md"
          TITLE="Telegram worker failure notice"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
          fi
