name: Telegram Resolver Worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-resolver-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-queue:
    if: vars.TELEGRAM_RESOLVER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: server/telegram-worker
        run: npm install
      - name: Build worker
        working-directory: server/telegram-worker
        run: npm run build
      - name: Process one checkpointed queue batch
        working-directory: server/telegram-worker
        env:
          SUPABASE_URL: https://xevqbgjtxuveeqaiacvm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          RUN_ONCE: "true"
          MAX_CANDIDATES_PER_RUN: "250"
          MIN_REQUEST_INTERVAL_MS: "5000"
          REQUEST_JITTER_MS: "3000"
        run: node dist/index.js
