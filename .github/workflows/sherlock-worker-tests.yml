name: Sherlock Worker Tests
on:
  push:
    paths:
      - 'server/sherlock-worker/**'
      - 'supabase/functions/contacts-mcp/index.ts'
      - 'supabase/functions/contacts-bridge/index.ts'
      - 'supabase/migrations/*sherlock*'
      - '.github/workflows/sherlock-worker-tests.yml'
  pull_request:
    paths:
      - 'server/sherlock-worker/**'
      - 'supabase/migrations/*sherlock*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/sherlock-worker/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r server/sherlock-worker/requirements.txt
      - name: Compile worker
        run: python -m py_compile server/sherlock-worker/worker.py
      - name: Run classifier self-test
        run: python server/sherlock-worker/worker.py --self-test
      - name: Verify Sherlock CLI
        run: sherlock --version
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check contacts MCP Edge Function
        run: deno check supabase/functions/contacts-mcp/index.ts
      - name: Type-check contacts bridge Edge Function
        run: deno check supabase/functions/contacts-bridge/index.ts
